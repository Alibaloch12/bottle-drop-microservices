# ----------------------------------------------------------
# Bar Management web server
# ----------------------------------------------------------

server.port=8083

# ----------------------------------------------------------
# MySQL
# ----------------------------------------------------------

#spring.datasource.url=jdbc:mysql://localhost:3306/bar_management_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
#spring.datasource.username=${BAR_DB_USER:bar_user}
#spring.datasource.password=${BAR_DB_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bar_management_db}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:springuser}
spring.datasource.password=${DB_PASSWORD:secret_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==========================================================
# Resilience4j: User Management
# ==========================================================

resilience4j.circuitbreaker.instances.identityService.slidingWindowType=COUNT_BASED

# Evaluate the five most recent calls
resilience4j.circuitbreaker.instances.identityService.slidingWindowSize=5

# Do not calculate the failure rate until at least three calls exist
resilience4j.circuitbreaker.instances.identityService.minimumNumberOfCalls=3

# Open when at least 50% of the evaluated calls fail
resilience4j.circuitbreaker.instances.identityService.failureRateThreshold=50

# A call lasting more than two seconds is considered slow
resilience4j.circuitbreaker.instances.identityService.slowCallDurationThreshold=2s

# Open when at least 50% of calls are slow
resilience4j.circuitbreaker.instances.identityService.slowCallRateThreshold=50

# Remain open for ten seconds before testing recovery
resilience4j.circuitbreaker.instances.identityService.waitDurationInOpenState=10s

# Permit two test calls while half-open
resilience4j.circuitbreaker.instances.identityService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.identityService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Keep recent events for Actuator
resilience4j.circuitbreaker.instances.identityService.eventConsumerBufferSize=20

# A missing/inactive/incorrect-role user is a business result,
# not a User Management system failure.
resilience4j.circuitbreaker.instances.identityService.ignoreExceptions=com.example.barmanagement.domain.exception.ForbiddenOperationException
# ==========================================================
# Resilience4j: Warehouse Management
# ==========================================================

resilience4j.circuitbreaker.instances.warehouseService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.warehouseService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.warehouseService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.warehouseService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.warehouseService.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.instances.warehouseService.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.warehouseService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.warehouseService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.warehouseService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.warehouseService.eventConsumerBufferSize=20

# ==========================================================
# Resilience4j Time Limiters
# ==========================================================

resilience4j.timelimiter.instances.identityService.timeoutDuration=3s
resilience4j.timelimiter.instances.identityService.cancelRunningFuture=true

resilience4j.timelimiter.instances.warehouseService.timeoutDuration=5s
resilience4j.timelimiter.instances.warehouseService.cancelRunningFuture=true
# ----------------------------------------------------------
# Logical Eureka service IDs
# ----------------------------------------------------------

services.identity.service-id=user-management-service
services.warehouse.service-id=warehouse-management-service


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.show-actuator=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true