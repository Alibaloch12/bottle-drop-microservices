server.port=8086

services.bar.service-id=bar-management-service
services.purchase.service-id=purchase-service


#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#eureka.instance.prefer-ip-address=true
#eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents

resilience4j.circuitbreaker.instances.customerBarService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.customerBarService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.customerBarService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.customerBarService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerBarService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customerBarService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.customerBarService.automaticTransitionFromOpenToHalfOpenEnabled=true


resilience4j.circuitbreaker.instances.customerPurchaseService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.customerPurchaseService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.customerPurchaseService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.customerPurchaseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerPurchaseService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customerPurchaseService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.customerPurchaseService.automaticTransitionFromOpenToHalfOpenEnabled=true