# ==========================================================
# Config Server
# ==========================================================

spring.application.name=config-server
server.port=8888

# ==========================================================
# Native configuration repository
# ==========================================================

# Read configuration from this project's classpath
spring.profiles.active=native

spring.cloud.config.server.native.search-locations=classpath:/config-repository/

# We do not maintain label-specific directories such as /main.
spring.cloud.config.server.native.add-label-locations=false

# Return 404 when a requested service configuration
# does not exist instead of returning an empty environment.
spring.cloud.config.server.accept-empty=false

# ==========================================================
# Eureka
# ==========================================================

#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:false}
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==========================================================
# Actuator
# ==========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always